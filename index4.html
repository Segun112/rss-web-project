<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        #container {
            width: 100%;
            max-width: 400px;
            margin: 50px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input,
        button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: #4CAF50;
            color: white;
        }

        #chat-container {
            display: none;
        }

        #messages {
            list-style-type: none;
            padding: 0;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        #messages li {
            padding: 8px;
            margin: 5px 0;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="register-container">
            <h2>Create Account</h2>
            <input id="register-username" type="text" placeholder="Username" />
            <input id="register-password" type="password" placeholder="Password" />
            <button id="register-btn">Register</button>
            <p id="register-message"></p>
        </div>

        <div id="login-container">
            <h2>Login</h2>
            <input id="login-username" type="text" placeholder="Username" />
            <input id="login-password" type="password" placeholder="Password" />
            <button id="login-btn">Login</button>
            <p id="login-message"></p>
        </div>

        <div id="chat-container">
            <h2>Chat</h2>
            <ul id="messages"></ul>
            <input id="message-input" type="text" placeholder="Type a message..." />
            <input id="file" type="file" placeholder="choose your file to upload" />
            <button id="send-btn">Send</button>
            <link href="view-active-friends" aria-placeholder="click to view friends">

        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let username = '';

        document.getElementById('register-btn').addEventListener('click', async () => {
            const username = document.getElementById('register-username').value.trim();
            const password = document.getElementById('register-password').value.trim();
            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });
            const data = await response.json();
            document.getElementById('register-message').innerText = data.message;
        });

        document.getElementById('login-btn').addEventListener('click', async () => {
            const usernameInput = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput, password }),
            });
            const data = await response.json();
            if (response.ok) {
                username = usernameInput;
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('register-container').style.display = 'none';
                document.getElementById('chat-container').style.display = 'block';
            }
            document.getElementById('login-message').innerText = data.message;
        });

        document.getElementById('send-btn').addEventListener('click', () => {
            const message = document.getElementById('message-input').value.trim();
            if (event.key === 'Enter') {
                sendMessage();
                if (message) {
                    socket.emit('chatMessage', { username, message });
                    document.getElementById('message-input').value = '';
                }
                const file = document.getElementById('file').value.trim();
                if (message) {
                    socket.emit('chatMessage', { username, file });
                    document.getElementById('file').value = '';
                }
            }});

        socket.on('chatMessage', (data) => {
            const messagesList = document.getElementById('messages');
            const messageItem = document.createElement('li');
            messageItem.innerHTML = `<strong>${data.username}:</strong> ${data.message}`;
            messagesList.appendChild(messageItem);
        });
    </script>
</body>

</html>
